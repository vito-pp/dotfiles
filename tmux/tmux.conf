# status bar on top
set-option -g status-position top

# start window numbering at 1
set-option -g base-index 1

# start pane numbering at 1
set-option -g pane-base-index 1

# renumber windows after closing
set-option -g renumber-windows on

# enables mouse support inside tmux
set -g mouse on

# enables support for extended keyboard sequences
# set -g xterm-keys on

# tmux doesnt wait after Esc is pressed
set -s escape-time 0

# to scroll more 
set -g history-limit 10000

# enables truecolor (24-bit color)
set -g default-terminal "${TERM}"
set -ga terminal-overrides ",*:RGB"

##### Theme variables #####

set -g @bg "#26292C"
set -g @fg_dim "colour244"
set -g @fg_active "#718C00"
# set -g @fg_active "#14BA19"
set -g @fg_status "colour135"

##### Status bar #####

# Whole status bar
set -g status-style "fg=#{@fg_status},bg=#{@bg}"

# Center window tabs
set -g status-justify absolute-centre

##### Left #####

# Session name
set -g status-left "#[fg=#{@fg_dim},bg=#{@bg}] #S "

##### Right #####

# Pane title/path-like info, no date/hour
set -g status-right '#[fg=#{@fg_dim},bg=#{@bg}]#{?window_bigger,[#{window_offset_x}#,#{window_offset_y}] ,}"#{=21:pane_title}" '

##### Window tabs #####

# Inactive tabs
set -g window-status-style "fg=#{@fg_dim},bg=#{@bg}"
set -g window-status-format " #I:#W "

# Active tab
set -g window-status-current-style "fg=#{@fg_active},bg=#{@bg},bold"
set -g window-status-current-format " #I:#W "

unbind C-b
set -g prefix C-p
bind C-p send-prefix
